[project]
name = "nor-eco"
version = "0.1.0"
description = "Norsk statsøkonomi – fra kildene: statisk nettsted med kildebelagte tall"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pypdf>=4",
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: Playwright browser tests (run with: pytest tests/e2e)"]

[tool.uv]
package = false
