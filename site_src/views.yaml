# Registry of views. `status`: built | planned. `choice` is for the site owner after looking at the gallery:
# keep | improve | remove (empty = not decided). `catalogue` links to the ids in docs/VISUALIZATIONS.md.
views:
  - {id: hier-bars,          label: Søyler,          status: built,   size: S, type: snapshot, catalogue: [utg-hier-bars, innt-stacked-bars, rec-parallel-bars], requires: "hierarkisk datasett", default_for: [utgifter, inntekter, avstemming-data], choice: ""}
  - {id: treemap,            label: Flisekart,       status: built,   size: M, type: snapshot, catalogue: [utg-treemap], requires: "hierarkisk datasett, positive verdier", choice: ""}
  - {id: timeseries-lines,   label: Linjer,          status: built,   size: S, type: timeline, catalogue: [makro-bnp-lines, innt-timeline-gap, rec-timeline-gap], requires: "serier eller datasett over tid", default_for: [makro], choice: ""}
  - {id: timeseries-stacked, label: Stablet,         status: built,   size: S, type: timeline, catalogue: [utg-streamgraph, flow-stacked-timeline, makro-export-stacked, bef-stacked-timeline], requires: "hierarkisk datasett over tid", choice: ""}
  - {id: timeseries-bars,    label: Søyler over tid, status: built,   size: S, type: timeline, catalogue: [makro-export-stacked], requires: "serier (også negative verdier)", choice: ""}
  - {id: slope,              label: Før og nå,       status: built,   size: S, type: compare,  catalogue: [innt-slope, bef-slope-persons-aarsverk], requires: "to år, samme enhet", choice: ""}
  - {id: waterfall,          label: Trinn for trinn, status: built,   size: M, type: steps,    catalogue: [innt-waterfall, flow-waterfall-year, rec-bridge-waterfall], requires: "trinn med kontrollpunkt", default_for: [innt-waterfall, rec-bridge-waterfall], choice: ""}
  - {id: sunburst,           label: Solstråle,       status: planned, size: M, type: snapshot, catalogue: [utg-sunburst, innt-donut-pair, makro-donut-pair], requires: "hierarkisk datasett", choice: ""}
  - {id: icicle,             label: Istapp,          status: planned, size: M, type: snapshot, catalogue: [utg-icicle], requires: "hierarkisk datasett", choice: ""}
  - {id: marimekko,          label: Marimekko,       status: planned, size: M, type: snapshot, catalogue: [makro-marimekko, ssys-marimekko-eier], requires: "to dimensjoner", choice: ""}
  - {id: waffle,             label: Rutenett,        status: planned, size: M, type: snapshot, catalogue: [bef-waffle, ssys-waffle, bef-dot-units], requires: "andeler av en helhet (sysselsetting)", default_for: [bef-waffle], choice: ""}
  - {id: rings,              label: Ringer,          status: planned, size: M, type: snapshot, catalogue: [ssys-rings], requires: "statlig sysselsetting", choice: ""}
  - {id: receipt,            label: Kvittering,      status: planned, size: M, type: snapshot, catalogue: [flow-receipt], requires: "per innbygger", choice: ""}
  - {id: sankey,             label: Strøm,           status: planned, size: L, type: snapshot, catalogue: [flow-sankey, bef-sankey-status, rec-sankey-bridge, flow-alluvial-time], requires: "kilde til mål med bevaring", choice: ""}
  - {id: euler-upset,        label: Overlapp,        status: planned, size: L, type: snapshot, catalogue: [bef-euler, rec-euler-defs], requires: "snitt mellom grupper", choice: ""}
