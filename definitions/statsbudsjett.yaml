# Verbatim quotes. `python -m checks` (online step) verifies each quote still appears at its source.
definitions:
  - id: oljekorrigert-underskudd
    term: Oljekorrigert budsjettunderskudd
    quote: "Oljekorrigert budsjettunderskudd er statsbudsjettets underskudd når inntekter og utgifter fra petroleumsvirksomheten er holdt utenom. Det oljekorrigerte budsjettunderskuddet dekkes av overføringer fra Statens pensjonsfond utland."
    source_id: fin-ord-begreper
  - id: budsjettbalanse
    term: Budsjettbalanse
    quote: "Den faktiske budsjettbalansen er differansen mellom inntektene og utgiftene i statsbudsjettet. I Norge måles denne ved det oljekorrigerte underskuddet, som er budsjettbalansen utenom netto inntekter fra petroleumsvirksomheten. Ifølge rammeverket for budsjettpolitikken skal det oljekorrigerte underskuddet, slik det blir anslått i nysaldert budsjett, dekkes inn gjennom en overføring fra Statens pensjonsfond utland. Medregnet denne overføringen går statsbudsjettet i balanse."
    source_id: fin-ord-budsjettbalanse
  - id: strukturelt-underskudd
    term: Strukturelt oljekorrigert budsjettunderskudd
    quote: "Det strukturelle oljekorrigerte budsjettunderskuddet er det oljekorrigerte budsjettunderskuddet korrigert for konjunktursvingninger og andre mer tilfeldige svingninger i enkelte inntekst- og utgiftsposter, såkalt aktivitetskorrigering."
    source_id: fin-ord-sobu
  - id: handlingsregel-rettesnor
    term: Handlingsregelens rettesnor
    quote: "Det strukturelle oljekorrigerte budsjettunderskuddet skal ifølge handlingsregelen over tid følge den langsiktige rettesnoren på tre prosent av fondsverdien. Selv om det faktiske uttaket fra fondet tilsvarer det oljekorrigerte budsjettunderskuddet, er det det strukturelle oljekorrigerte budsjettunderskuddet som gjerne omtales som «bruk av fondsmidler» eller «bruk av oljepenger»."
    source_id: fin-ord-sobu
  - id: handlingsregelen
    term: Handlingsregelen
    quote: "Handlingsregelen er et begrep som benyttes om retningslinjene for bruk av midler fra Statens pensjonsfond utland over statsbudsjettet. Etter at handlingsregelen kom i bruk i 2002 er statens oljeinntekter i sin helhet tilført Statens pensjonsfond utland."
    source_id: fin-ord-begreper
  - id: inntekter-i-alt
    term: Inntekter i alt (statsregnskapet)
    quote: "Inntekter i alt: Totale inntekter før eventuelle tilbakeføringer fra Statens pensjonsfond - Utland."
    source_id: ssb-statsregnskap-om
  - id: overskudd-for-avsetning
    term: Overskudd før netto avsetning til Statens pensjonsfond utland
    quote: "Overskudd før netto avsetning til Statens pensjonsfond - Utland: Inntekter i alt fratrukket utgifter i alt."
    source_id: ssb-statsregnskap-om
  - id: budsjettall-oppdateres
    term: Budsjettall i statistikkbanken
    quote: "Budsjettall oppdateres i statistikkbanken ved publisering av tall for 3. og 4. kvartal."
    source_id: ssb-statsregnskap-om
  - id: cofog
    term: Utgifter etter formål (COFOG)
    quote: "Gruppering av utgifter etter formål er basert på FNs Classification of the Functions of Government"
    source_id: ssb-offinnut-om
  - id: offinnut-omfang
    term: Offentlig forvaltnings utgifter
    quote: "Statistikken gir informasjon om utgiftene i stats- og kommuneforvaltningen, fordelt på utgiftstyper og formål."
    source_id: ssb-offinnut-om
  - id: offinnut-overforinger
    term: Overføringer mellom stats- og kommuneregnskapene
    quote: "For eksempel er det vanskelig å få overføringene mellom stats- og kommuneregnskapene til å stemme overens."
    source_id: ssb-offinnut-om
  - id: lanetransaksjoner-ikke-medregnet
    term: Lånetransaksjoner i budsjettforslaget
    quote: "Lånetransaksjoner er ikke medregnet i tallene."
    source_id: fin-sb2027-inntekter-utgifter
  - id: oljekorrigert-dekkes-av-spu
    term: Dekning av oljekorrigert underskudd
    quote: "Dette oljekorrigerte underskuddet dekkes ved en tilsvarende overføring fra Statens pensjonsfond utland."
    source_id: fin-sb2027-inntekter-utgifter
  - id: andre-utgifter-residual
    term: «Andre utgifter» i tabell 1
    quote: "Andre utgifter er en residual som består av utgiftene til alle formål som ikke inngår i de opplistede kategoriene."
    source_id: fin-sb2027-inntekter-utgifter
  - id: finansieringsbehov
    term: Finansieringsbehov
    quote: "Finansieringsbehov: Underskudd før lånetransaksjoner pluss netto utlån mv. og avdrag på statsgjelden."
    source_id: ssb-statsregnskap-om
