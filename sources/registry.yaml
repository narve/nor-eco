# Register EVERY source here before it is fetched or cited. Fields:
#   id         stable slug, used in source_ids everywhere
#   publisher  who publishes it
#   title      title of the table / document
#   url        https link to the exact table or publication
#   table_id   (optional) table or document id at the publisher
#   licence    licence as stated by the publisher
#   notes      (optional) scope, caveats
# The retrieval date and the pages that use a source are filled in at build time (kilder.html).
