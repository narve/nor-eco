notes: Sysselsatte 15–74 år etter arbeidssted, 4. kvartal. Statsforvaltningen omfatter
  stats- og trygdeforvaltningen og inkluderer helseforetakene. Offentlig eide foretak
  omfatter foretak der det offentlige kontrollerer mer enn 50 prosent av aksjekapitalen,
  både statlig og kommunalt eide. SSB runder av celler med få personer, så summen
  kan avvike litt fra totalen.
