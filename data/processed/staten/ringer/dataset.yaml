id: staten.ringer
title: Ansatte i fire grupper rundt staten, 2025
unit: personer
price_basis: ikke-relevant
claim_level: utledet
derivation: Fire tall fra to kilder lagt ved siden av hverandre. Ansatte i staten
  er årsgjennomsnitt (SSB); de tre andre er antall ansatte i konsernene ved årsskiftet
  (Statens eierrapport), uten vekting med eierandel og inkludert ansatte utenfor Norge.
source_ids:
- ssb-12623
- nfd-eierrapport-2025
dimensions:
- ring
default_dimension: ring
notes: Gruppene har ikke felles målemetode. Ansatte i staten er ansatte i statlige
  virksomheter i Norge (årsgjennomsnitt). De tre andre er konsernenes ansatte og kan
  inkludere ansatte utenfor Norge. Summen er derfor en samlet oversikt, ikke en offisiell
  telling. Kommunesektoren er vist for seg, og privat finansierte tjenesteytere og
  arbeidsmarkedstiltak er ikke med.
